spring:
  main:
    allow-bean-definition-overriding: true # [핵심] 기존 진짜 객체를 가짜로 덮어쓰도록 허용
  profiles:
    active: test
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false
        highlight_sql: false

jwt:
  access-expire-seconds: 900
  refresh-expire-seconds: 604800
  secret: test-secret-key-for-testing-purposes-only

logging:
  level:
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF
    org.hibernate.orm.jdbc.extract: OFF
    org.springframework.transaction.interceptor: OFF

# [핵심 추가] 깃허브 액션 환경에서 스프링 컨텍스트 에러를 방지하기 위한 더미 데이터
kis:
  app-key: "test-app-key-for-ci"
  app-secret: "test-app-secret-for-ci"
  rest-base-url: "http://localhost:8080" # KisProperties 바인딩 에러 방지용
  ws-url: "ws://localhost:8080"          # KisProperties 바인딩 에러 방지용