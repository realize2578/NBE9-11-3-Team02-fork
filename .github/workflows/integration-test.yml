name: Integration Test Automation

on:
  push:

jobs:
  integration-test:
    runs-on: ubuntu-latest 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 🛠️ [수정됨] 최상위 폴더에 있는 docker-compose.yaml을 바라보도록 경로 변경
      - name: Start Database with Docker Compose
        run: |
          docker-compose -f docker-compose.yaml up -d
          
          # 단순 15초 대기가 아니라, MySQL이 3306 포트에서 통신을 받을 준비가 
          # 될 때까지 상태를 체크하는 조금 더 안정적인 스크립트로 보강했습니다.
          echo "Waiting for MySQL to be ready..."
          while ! nc -z localhost 3306; do
            sleep 1
          done
          echo "MySQL is up and running!"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Integration Tests
        run: ./gradlew test

      # 🛠️ [수정됨] 종료 시에도 최상위 폴더의 docker-compose.yaml을 참조하도록 변경
      - name: Stop Database
        if: always() 
        run: docker-compose -f docker-compose.yaml down
